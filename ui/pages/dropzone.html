<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Dividir tela</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    body { background: rgb(5 6 8 / 0.35); animation: fade 0.15s ease both; }
    @keyframes fade { from { opacity: 0; } }
    /* Prévia de onde a aba vai ficar */
    .preview {
      position: fixed;
      border-radius: 14px;
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 2px var(--accent);
      transition: all 0.18s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      opacity: 0;
    }
    .preview.on { opacity: 1; }
    .hint {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      box-shadow: inset 0 0 0 1px var(--line), 0 14px 34px rgb(0 0 0 / 0.5);
      text-align: center;
      pointer-events: none;
    }
    .hint b { font-size: 14px; }
    .hint span { color: var(--text-dim); font-size: 12.5px; max-width: 280px; }
    .zones { display: grid; grid-template-columns: repeat(3, 26px); grid-template-rows: repeat(3, 20px); gap: 4px; }
    .zones i { border-radius: 4px; background: var(--surface-hover); }
    .zones i.on { background: var(--accent); }
    .zones i.center { background: transparent; }
  </style>
</head>
<body>
  <div class="preview" id="preview"></div>
  <div class="hint" id="hint">
    <div class="zones" id="zones">
      <i></i><i data-zone="top"></i><i></i>
      <i data-zone="left"></i><i class="center"></i><i data-zone="right"></i>
      <i></i><i data-zone="bottom"></i><i></i>
    </div>
    <b id="title">Dividir a tela</b>
    <span id="text">Solte numa das bordas: a aba fica desse lado.</span>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    let info = { same: false, wide: true };
    let zone = null;
    const LABEL = { left: '◧  Esquerda', right: 'Direita  ◨', top: 'Em cima', bottom: 'Embaixo' };

    window.wolf.on('dropzone', (data) => {
      info = data;
      zone = null;
      $('preview').classList.remove('on');
      $('title').textContent = data.same ? 'Não há outra aba para dividir' : `Dividir com "${data.title.slice(0, 40)}"`;
      $('text').textContent = data.same
        ? 'Abra mais uma aba e arraste de novo.'
        : `Solte numa das bordas. Sugestão: ${data.wide ? 'lado a lado (esquerda ou direita)' : 'uma em cima da outra'}.`;
    });

    // Zona pela posição do mouse: bordas = divisão; no meio = sugestão inteligente (pelo formato da tela).
    function zoneAt(x, y) {
      const w = innerWidth;
      const h = innerHeight;
      const fx = x / w;
      const fy = y / h;
      if (fx < 0.3) return 'left';
      if (fx > 0.7) return 'right';
      if (fy < 0.3) return 'top';
      if (fy > 0.7) return 'bottom';
      return info.wide ? (fx < 0.5 ? 'left' : 'right') : (fy < 0.5 ? 'top' : 'bottom');
    }

    function show(z) {
      if (z === zone) return;
      zone = z;
      const p = $('preview');
      const m = 10;
      const half = { left: [m, m, '50%', `calc(100% - ${m * 2}px)`], right: ['50%', m, `calc(50% - ${m}px)`, `calc(100% - ${m * 2}px)`], top: [m, m, `calc(100% - ${m * 2}px)`, '50%'], bottom: [m, '50%', `calc(100% - ${m * 2}px)`, `calc(50% - ${m}px)`] }[z];
      Object.assign(p.style, { left: typeof half[0] === 'number' ? `${half[0]}px` : half[0], top: typeof half[1] === 'number' ? `${half[1]}px` : half[1], width: half[2], height: half[3] });
      p.textContent = LABEL[z];
      p.classList.add('on');
      for (const i of document.querySelectorAll('.zones i')) i.classList.toggle('on', i.dataset.zone === z);
    }

    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (info.same) return;
      e.dataTransfer.dropEffect = 'move';
      show(zoneAt(e.clientX, e.clientY));
    });
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      window.wolf.invoke('split:drop', info.same ? null : zoneAt(e.clientX, e.clientY));
    });
  </script>
</body>
</html>
