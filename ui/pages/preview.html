<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Prévia</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body {
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgb(5 6 8 / 0.6);
      animation: fade 0.2s ease both;
    }

    /* Moldura atrás da página: dá a sombra e a borda do cartão. */
    .frame {
      position: fixed;
      border-radius: 14px;
      background: var(--bg);
      box-shadow:
        0 0 0 1px rgb(255 255 255 / 0.09),
        0 30px 90px rgb(0 0 0 / 0.7);
      animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
    }
    .loading {
      position: absolute;
      left: 14px;
      right: 14px;
      top: -1px;
      height: 2px;
      overflow: hidden;
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .loading.on { opacity: 1; }
    .loading div {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }

    /* Barrinha flutuante acima do cartão */
    .bar {
      position: fixed;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 38px;
      animation: drop 0.25s 0.05s cubic-bezier(0.2, 0.9, 0.3, 1.1) both;
    }
    .site {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      max-width: 70%;
      height: 36px;
      padding: 0 14px 0 6px;
      border-radius: 18px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08), 0 8px 24px rgb(0 0 0 / 0.4);
    }
    .fav {
      flex: none;
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--frame);
      color: var(--text-dim);
    }
    .fav img { width: 15px; height: 15px; }
    .fav svg { width: 14px; height: 14px; }
    .site .title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .site .host {
      flex: none;
      color: var(--text-dim);
      font-size: 12px;
      white-space: nowrap;
    }
    .site .host .lock { margin-right: 3px; color: #8fd694; }
    .site .host .lock svg { width: 11px; height: 11px; vertical-align: -1px; }
    .dot { flex: none; color: var(--text-faint, #5c616c); }

    .actions {
      display: flex;
      gap: 4px;
      padding: 3px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08), 0 8px 24px rgb(0 0 0 / 0.4);
    }
    .actions button {
      position: relative;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      color: var(--text-dim);
      transition: background 0.12s, color 0.12s, transform 0.12s;
    }
    .actions button:hover { background: rgb(255 255 255 / 0.08); color: var(--text); }
    .actions button:active { transform: scale(0.92); }
    .actions button svg { width: 16px; height: 16px; }
    .actions .primary { background: var(--accent); color: var(--bg); }
    .actions .primary:hover { background: color-mix(in srgb, var(--accent) 82%, white); color: var(--bg); }

    /* Dica ao passar o mouse */
    .actions button::after {
      content: attr(data-tip);
      position: absolute;
      top: 50%;
      right: calc(100% + 10px);
      padding: 5px 9px;
      border-radius: 7px;
      background: var(--frame);
      box-shadow: 0 0 0 1px rgb(255 255 255 / 0.08);
      color: var(--text);
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transform: translate(4px, -50%);
      pointer-events: none;
      transition: opacity 0.12s, transform 0.12s;
    }
    .actions button:hover::after { opacity: 1; transform: translate(0, -50%); }

    body.out .frame, body.out .bar { animation: popout 0.14s ease both; }
    body.out .backdrop { animation: fadeout 0.14s ease both; }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.975); } }
    @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
    @keyframes popout { to { opacity: 0; transform: translateY(8px) scale(0.985); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes fadeout { to { opacity: 0; } }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <div class="bar" id="bar">
    <div class="site" id="site">
      <span class="fav" id="fav"></span>
      <span class="title" id="title">Carregando…</span>
      <span class="dot">·</span>
      <span class="host" id="host"></span>
    </div>
    <div class="actions">
      <button id="here" data-tip="Abrir nesta aba">
        <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 0 1 0 10h-2"/></svg>
      </button>
      <button id="tab" class="primary" data-tip="Abrir em nova aba · Ctrl+Enter">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
      </button>
      <button id="close" data-tip="Fechar · Esc">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
  </div>

  <div class="frame" id="frame"><div class="loading" id="loading"><div></div></div></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const GLOBE = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg>';
    const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    let shownFavicon;
    let readySent = false;

    window.wolf.on('preview', (info) => {
      const { card } = info;
      Object.assign($('frame').style, {
        left: `${card.x}px`,
        top: `${card.y}px`,
        width: `${card.width}px`,
        height: `${card.height}px`,
      });
      // A barrinha fica alinhada com o cartão, logo acima dele.
      Object.assign($('bar').style, {
        left: `${card.x}px`,
        width: `${card.width}px`,
        top: `${card.y - 46}px`,
      });

      $('title').textContent = info.title || 'Carregando…';
      $('host').innerHTML = '';
      try {
        const u = new URL(info.url);
        if (u.protocol === 'https:') $('host').append(Object.assign(document.createElement('span'), { className: 'lock', innerHTML: LOCK }));
        $('host').append(u.host.replace(/^www\./, ''));
        $('site').title = info.url;
      } catch {
        $('host').textContent = info.url;
      }
      $('loading').classList.toggle('on', info.loading);

      if (info.favicon !== shownFavicon) {
        shownFavicon = info.favicon;
        const fav = $('fav');
        fav.innerHTML = GLOBE;
        if (info.favicon) {
          const img = Object.assign(document.createElement('img'), { src: info.favicon });
          img.onload = () => fav.replaceChildren(img);
        }
      }

      // Mostra a página só depois da animação de entrada do cartão.
      if (!readySent) {
        readySent = true;
        setTimeout(() => window.wolf.invoke('preview:ready'), 180);
      }
    });

    function close() {
      if (document.body.classList.contains('out')) return;
      document.body.classList.add('out');
      window.wolf.invoke('preview:close');
    }
    $('backdrop').onclick = close;
    $('close').onclick = close;
    $('tab').onclick = () => window.wolf.invoke('preview:open-tab');
    $('site').ondblclick = () => window.wolf.invoke('preview:open-tab');
    $('site').title = 'Duplo clique para abrir como aba';
    $('here').onclick = () => window.wolf.invoke('preview:open-here');
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  </script>
</body>
</html>
