<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' http: https: data: wolf: crx:; style-src 'self' 'unsafe-inline' wolf:">
  <title>Wolf Browser</title>
  <link rel="stylesheet" href="style.css">
  <!-- Cores do tema escolhido (geradas pelo navegador) -->
  <link rel="stylesheet" href="wolf://app/theme.css">
</head>
<body>
  <aside id="sidebar">
    <div class="glow"></div>

    <header id="brand">
      <button id="logo" title="Wolf Browser">
        <img src="assets/wolf-128.png" alt="">
      </button>
      <div id="wordmark">
        <span class="w1">Wolf</span><span class="w2">Browser</span>
      </div>
      <button id="toggle" class="icon" title="Recolher barra (Ctrl+B)">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
      </button>
    </header>

    <nav id="nav">
      <div class="group">
        <button id="back" class="icon" title="Voltar (Alt+←)">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <button id="forward" class="icon" title="Avançar (Alt+→)">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button id="reload" class="icon" title="Recarregar (Ctrl+R)">
          <svg class="when-idle" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4h-4"/></svg>
          <svg class="when-loading" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button id="zoom" class="pill" title="Voltar ao zoom normal (Ctrl+0)" hidden></button>
      <button id="home" class="icon" title="Página inicial (Alt+Home)">
        <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>
      </button>
    </nav>

    <form id="address-form">
      <span id="site-icon"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="Pesquisar ou digitar URL">
      <button id="shield" type="button" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3.5l7 2.5v5.5c0 4.4-3 7.9-7 9-4-1.1-7-4.6-7-9V6z"/></svg>
        <span id="blocked-count"></span>
      </button>
      <button id="star" type="button" title="Adicionar aos favoritos (Ctrl+D)">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
      </button>
      <ul id="suggestions" hidden></ul>
    </form>

    <div id="popup-bar" hidden>
      <span class="pb-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 9h16M9 13l6 4M15 13l-6 4"/></svg></span>
      <span id="popup-text">Pop-up bloqueado</span>
      <button id="popup-open">Abrir</button>
      <button id="popup-dismiss" class="icon small" title="Dispensar">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <div id="translate-bar" hidden>
      <span class="tr-icon"><svg viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5 7M11 5c-.8 3.5-3.5 6.5-7 8M13 21l4-9 4 9M14.5 18h5"/></svg></span>
      <span id="translate-text"></span>
      <button id="translate-toggle"></button>
      <button id="translate-stop" class="icon small" title="Parar de traduzir">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <browser-action-list id="extension-actions" alignment="bottom right"></browser-action-list>

    <div id="find" hidden>
      <svg class="find-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="find-input" type="text" spellcheck="false" placeholder="Procurar na página">
      <span id="find-count"></span>
      <button id="find-prev" class="icon small" title="Anterior (Shift+Enter)">
        <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <button id="find-next" class="icon small" title="Próximo (Enter)">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="find-close" class="icon small" title="Fechar (Esc)">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>

    <section id="bookmarks-section" hidden>
      <div id="bookmarks"></div>
    </section>

    <div id="spaces"></div>

    <!-- Abas fixadas do espaço (atalhos que não somem ao fechar) -->
    <div id="pinned"></div>

    <div class="divider"><span id="space-name">Abas</span></div>

    <div id="tabs-scroll">
      <div id="tabs"></div>
      <button id="new-tab" title="Nova aba (Ctrl+T)">
        <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></span>
        <span class="label">Nova aba</span>
        <kbd>Ctrl T</kbd>
      </button>
    </div>

    <footer id="footer">
      <button id="open-media" class="icon" title="Mídia tocando">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
        <span class="eq"><i></i><i></i><i></i></span>
      </button>
      <button id="open-ai" class="icon" title="Painel de IA (Ctrl+Shift+A)">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L19 9.5l-5.2 1.6L12 16l-1.8-4.9L5 9.5l5.2-1.6zM18.5 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      </button>
      <button id="open-history" class="icon" title="Histórico (Ctrl+H)">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4M12 8v4l3 2"/></svg>
      </button>
      <button id="open-downloads" class="icon" title="Downloads (Ctrl+J)">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span id="downloads-badge" hidden></span>
      </button>
      <button id="open-bookmarks" class="icon" title="Favoritos (Ctrl+Shift+O)">
        <svg viewBox="0 0 24 24"><path d="M6.5 4h11a.5.5 0 0 1 .5.5V20l-6-4-6 4V4.5a.5.5 0 0 1 .5-.5z"/></svg>
      </button>
      <button id="open-extensions" class="icon" title="Extensões">
        <svg viewBox="0 0 24 24"><path d="M9.5 4.5a2 2 0 0 1 4 0V6H17a1 1 0 0 1 1 1v3.5h1.5a2 2 0 0 1 0 4H18V18a1 1 0 0 1-1 1h-3.5v-1.5a2 2 0 0 0-4 0V19H6a1 1 0 0 1-1-1v-3.5h1.5a2 2 0 0 0 0-4H5V7a1 1 0 0 1 1-1h3.5z"/></svg>
      </button>
      <button id="open-settings" class="icon" title="Configurações">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </footer>
  </aside>

  <script src="renderer.js"></script>
</body>
</html>
